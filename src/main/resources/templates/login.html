<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập - ExamBuilder</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-body">
  <div class="auth-card">
    <a class="brand" th:href="@{/}"><span class="brand-icon">E</span> ExamBuilder</a>
    <h1>Chào mừng trở lại</h1><p class="muted">Đăng nhập để tiếp tục soạn đề thi.</p>
    <div class="notice success" th:if="${param.registered}">Đăng ký thành công. Hãy đăng nhập!</div>
    <div class="notice error" th:if="${param.error}">Tên đăng nhập hoặc mật khẩu không đúng.</div>
    <form th:action="@{/login}" method="post" class="stack">
      <label>Tên đăng nhập<input name="username" type="text" autocomplete="username" placeholder="ten_dang_nhap" required autofocus></label>
      <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required></label>
      <button class="btn btn-block" type="submit">Đăng nhập</button>
    </form>
    <p class="auth-switch">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
  </div>
</body></html>
